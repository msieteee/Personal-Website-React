name: Build and Push Docker Image to Artifact Registry

on:
  push:
    branches:
      - master # or main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Authenticate with GCP
      - name: Set up GCP credentials
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: alien-craft-484704-u4

      # 4️⃣ Configure Docker to use GCP Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      # 5️⃣ Build and push Docker image to Artifact Registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: asia-southeast1-docker.pkg.dev/alien-craft-484704-u4/personal-react-website:latest
          build-args: |
            NODE_ENV=production
