name: Build, Push, and Deploy Docker Image to Cloud Run

on:
  push:
    branches:
      - master # or main

jobs:
  # 1️⃣ Build & push Docker image
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: alien-craft-484704-u4
          version: latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: asia-southeast1-docker.pkg.dev/alien-craft-484704-u4/personal-react-website/personal-react-website:latest
          build-args: |
            NODE_ENV=production

  # 2️⃣ Deploy to Cloud Run
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy react-personal-website \
            --image asia-southeast1-docker.pkg.dev/alien-craft-484704-u4/personal-react-website/personal-react-website:latest \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated
