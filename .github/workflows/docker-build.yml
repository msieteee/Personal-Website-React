name: Build, Push, and Deploy Docker Image to Cloud Run

on:
  push:
    branches:
      - master # or main

jobs:
  # 1️⃣ Build Docker image
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: alien-craft-484704-u4
          version: latest

      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_TAG=asia-southeast1-docker.pkg.dev/alien-craft-484704-u4/personal-react-website/personal-react-website:latest
          docker buildx build \
            --build-arg NODE_ENV=production \
            -t $IMAGE_TAG \
            .
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # 2️⃣ Push Docker image
  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Push Docker image
        run: docker push ${{ needs.build.outputs.image }}

  # 3️⃣ Deploy to Cloud Run
  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy react-personal-website \
            --image ${{ needs.build.outputs.image }} \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated
